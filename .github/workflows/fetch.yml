name: 竞彩赔率自动采集

on:
  schedule:
    - cron: '15 * * * *'   # 每小时15分跑一次
  workflow_dispatch:        # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 拉取赔率快照
        run: python3 sporttery_client.py fetch
      - name: 提交更新的数据
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sporttery.db matches.json
          git diff --staged --quiet || git commit -m "auto: snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
